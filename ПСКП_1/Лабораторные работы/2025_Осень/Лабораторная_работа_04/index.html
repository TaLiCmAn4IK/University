<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление БД</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
        .section { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; }
        input { margin-right: 10px; }
    </style>
</head>
<body>
    <h2>База данных (04-02)</h2>

    <div class="section">
        <button onclick="getAll()">Получить все (GET)</button>
        <div id="output" style="margin-top: 10px;"></div>
    </div>

    <div class="section">
        <h3>Добавить (POST)</h3>
        <input type="text" id="postName" placeholder="Имя">
        <input type="date" id="postBday" placeholder="Дата рождения">
        <button onclick="addRow()">Добавить</button>
    </div>

    <div class="section">
        <h3>Изменить (PUT)</h3>
        <input type="number" id="putId" placeholder="ID">
        <input type="text" id="putName" placeholder="Новое имя">
        <input type="date" id="putBday" placeholder="Новая дата">
        <button onclick="updateRow()">Изменить</button>
    </div>

    <div class="section">
        <h3>Удалить (DELETE)</h3>
        <input type="number" id="delId" placeholder="ID">
        <button onclick="deleteRow()">Удалить</button>
    </div>

    <script>
        const apiUrl = 'http://localhost:5001/api/db';

        async function getAll() {
            const res = await fetch(apiUrl);
            const data = await res.json();
            let html = '<table><tr><th>ID</th><th>Имя</th><th>Дата рождения</th></tr>';
            data.forEach(r => {
                html += `<tr><td>${r.id}</td><td>${r.name}</td><td>${r.bday}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('output').innerHTML = html;
        }

        async function addRow() {
            const name = document.getElementById('postName').value;
            const bday = document.getElementById('postBday').value;
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, bday })
            });
            const data = await res.json();
            document.getElementById('output').innerText = 'Добавлено: ' + JSON.stringify(data);
        }

        async function updateRow() {
            const id = parseInt(document.getElementById('putId').value);
            const name = document.getElementById('putName').value;
            const bday = document.getElementById('putBday').value;
            const res = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, name, bday })
            });
            const data = await res.json();
            document.getElementById('output').innerText = 'Изменено: ' + JSON.stringify(data);
        }

        async function deleteRow() {
            const id = document.getElementById('delId').value;
            const res = await fetch(`${apiUrl}?id=${id}`, { method: 'DELETE' });
            const data = await res.json();
            document.getElementById('output').innerText = 'Удалено: ' + JSON.stringify(data);
        }
    </script>
</body>
</html>
