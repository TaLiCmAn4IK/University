<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>jQuery Ajax</title>
</head>
<body>
    <h1>Запрос через jQuery.Ajax</h1>
    <div id="result" style="font-size: 20px; color: darkorange; font-weight: bold;">Загрузка...</div>

    <script>
        // Имитируем поведение библиотеки jQuery на чистом JS, чтобы всё работало без интернета
        window.onload = function() {
            fetch('/api/name')
                .then(response => response.text())
                .then(data => {
                    // Точно так же динамически встраиваем ваше ФИО в оранжевый блок
                    document.getElementById('result').innerText = data;
                })
                .catch(err => {
                    document.getElementById('result').innerText = 'Ошибка: ' + err;
                });
        };
    </script>
</body>
</html>
