<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .img{
            width: 320px;
            height: 275px;
        }
        figure{
            float: left;
            margin-bottom: 30px;
        }
        figure:not(:nth-child(4n)){
            margin-right: 60px;
        }
        figcaption{
            text-align: center;
        }
    </style>
</head>

    <figure>
        <img src="1.jpg" alt="обои на пк 1" class="img">

    </figure>
    <figure>

    </figure>

    </figure>
    <figure>

        <figcaption>Леонардо</figcaption>
    </figure>
    <figure>

    <figure>

    <figure>

    <figure>

</html>
