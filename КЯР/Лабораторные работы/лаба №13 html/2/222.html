<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аттестация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h2 {
            text-align: center;
            margin-top: 20px;
        }
        table {
            width: 50%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f0f0f0;
        }
        td {
            font-size: 16px;
        }
        .green {
            background-color: #00FF00;
        }
        .white {
            background-color: #FFFFFF;
        }
        .red {
            background-color: #FF0000;
        }
    </style>
</head>
<body>
    <h2>Аттестация</h2>
    <table>
        <tr>
            <th>Студент</th>
            <th>Оценка</th>
        </tr>
        <tr>
            <td>Студент 1</td>
            <td class="white">4</td>
        </tr>
        <tr>
            <td>Студент 2</td>
            <td class="red">2</td>
        </tr>
        <tr>
            <td>Студент 3</td>
            <td class="green">10</td>
        </tr>
        <tr>
            <td>Студент 4</td>
            <td class="white">5</td>
        </tr>
        <tr>
            <td>Студент 5</td>
            <td class="red">2</td>
        </tr>
        <tr>
            <td>Студент 6</td>
            <td class="red">3</td>
        </tr>
        <tr>
            <td>Студент 7</td>
            <td class="white">4</td>
        </tr>
        <tr>
            <td>Студент 8</td>
            <td class="green">9</td>
        </tr>
        <tr>
            <td>Студент 9</td>
            <td class="red">3</td>
        </tr>
        <tr>
            <td>Студент 10</td>
            <td class="white">7</td>
        </tr>
        <tr>
            <td>Студент 11</td>
            <td class="white">4</td>
        </tr>
        <tr>
            <td>Студент 12</td>
            <td class="white">8</td>
        </tr>
        <tr>
            <td>Студент 13</td>
            <td class="white">6</td>
        </tr>
        <tr>
            <td>Студент 14</td>
            <td class="green">9</td>
        </tr>
        <tr>
            <td>Студент 15</td>
            <td class="white">7</td>
        </tr>
    </table>
</body>
</html>
