<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>С Днем Рождения!</title>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
}

.background {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, #ffafbd, #ffc3a0);
    z-index: 1;
}

.container {
    position: relative;
    z-index: 2;
    text-align: center;
}

.birthday-title {
    font-size: 4em;
    color: #ffffff;
    animation: fadeIn 2s ease forwards;
}

.birthday-message {
    font-size: 1.5em;
    color: #ffffff;
    margin-top: 20px;
    animation: fadeIn 2s ease forwards;
    animation-delay: 0.5s;
}

.fireworks {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.firework {
    position: absolute;
    background: radial-gradient(circle, rgba(255, 204, 0, 1) 0%, rgba(255, 0, 0, 0) 70%);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    opacity: 0;
    animation: explode 1s forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes explode {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-200px) scale(2);
        opacity: 0;
    }
}
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <h1 class="birthday-title">С Днем Рождения!</h1>
        <p class="birthday-message">Желаю счастья, здоровья и исполнения всех желаний!</p>
        <div class="fireworks"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
